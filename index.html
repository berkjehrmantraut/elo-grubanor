<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Stakes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --stone:#EDE4E2;
  --paper:#FDFAF8;
  --ink:#241A20;
  --ink-soft:#6B5A60;
  --quartz:#A8455E;
  --prairie:#456B52;
  --amber:#D8A03C;
  --line:rgba(36,26,32,.14);
  --shadow:0 1px 0 rgba(36,26,32,.09), 0 12px 28px -18px rgba(36,26,32,.5);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Inter Tight",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--stone);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}

/* ---------------------------------------------------------- top bar */

.topbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 20px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--stone) 80%,white);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(6px);
}
.wordmark{
  font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;
  font-variation-settings:"wdth" 82;margin-right:auto;
  display:flex;align-items:baseline;gap:8px;
}
.wordmark span{
  font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--quartz);
}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{
  appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;padding:7px 13px;color:var(--ink-soft);
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--quartz);outline-offset:-2px}

/* ---------------------------------------------------------- shell */

main{max-width:960px;margin:0 auto;padding:24px 20px 72px}
.view[hidden]{display:none}
.eyebrow{
  font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 16px;
}
.eyebrow b{color:var(--quartz);font-weight:600}
.loading{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.note{
  background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--quartz);
  border-radius:3px;padding:16px 18px;font-size:14.5px;
}
.note code{font-family:var(--mono);font-size:12.5px;background:var(--stone);padding:1px 5px;border-radius:2px}

.btn{
  appearance:none;font:inherit;cursor:pointer;background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:8px 15px;
  font-size:13.5px;color:var(--ink);transition:background .15s ease,border-color .15s ease;
}
.btn:hover{background:var(--paper);border-color:rgba(36,26,32,.32)}
.btn:focus-visible{outline:2px solid var(--quartz);outline-offset:2px}
.btn.strong{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.strong:hover{background:#3a2a32}
.btn.quiet{color:var(--ink-soft)}
.btn[disabled]{opacity:.4;cursor:default}

/* ---------------------------------------------------------- bracket tree */

.tree-scroll{overflow-x:auto;padding-bottom:6px;margin-bottom:26px;-webkit-overflow-scrolling:touch}
.tree{
  display:grid;grid-template-columns:1.35fr 1.15fr 1.15fr .9fr;
  gap:0 12px;min-width:620px;min-height:200px;
}
.tree .col{display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.tree .tie{
  display:flex;flex-direction:column;gap:3px;position:relative;
  padding-right:11px;border-right:1px solid var(--line);
}
.tree .tie::after{
  content:'';position:absolute;right:-12px;top:50%;
  width:12px;border-top:1px solid var(--line);
}
.tree .col:last-child .tie{padding-right:0;border-right:0}
.tree .col:last-child .tie::after{display:none}

.chip{
  display:flex;align-items:center;gap:6px;
  font-size:12.5px;line-height:1.25;
  padding:6px 9px;border-radius:3px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .2s ease,color .2s ease,border-color .2s ease;
}
.chip .sd{
  font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);
  flex:0 0 auto;opacity:.7;
}
.chip .nm{overflow:hidden;text-overflow:ellipsis}
.chip.tbd{background:transparent;border-style:dashed;color:rgba(107,90,96,.5)}
.chip.won{background:var(--paper);color:var(--ink);border-color:rgba(69,107,82,.5);font-weight:500}
.chip.out{opacity:.42;text-decoration:line-through}
.chip.live{border-color:var(--quartz);box-shadow:0 0 0 2px rgba(168,69,94,.13);color:var(--ink)}
.chip.champ{
  background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600;
}
.chip.champ .sd{color:rgba(253,250,248,.6)}

/* ---------------------------------------------------------- duel cards */

.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.card{
  position:relative;display:flex;flex-direction:column;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:4px;
  box-shadow:var(--shadow);padding:0;overflow:hidden;cursor:pointer;
  font:inherit;color:inherit;appearance:none;
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, opacity .16s ease;
}
.card:hover{transform:translateY(-3px);border-color:rgba(168,69,94,.45)}
.card:focus-visible{outline:2px solid var(--quartz);outline-offset:3px}
.card.win{border-color:var(--prairie);transform:translateY(-6px)}
.card.lose{opacity:.4;transform:scale(.98)}
.card .body{display:flex;flex-direction:column;flex:1;padding:20px 22px 18px}

.card .photo,.thumb{
  position:relative;overflow:hidden;
  background:var(--tint,var(--quartz));
}
.card .photo{aspect-ratio:16/10;border-bottom:1px solid var(--line)}
.card .photo::after,.thumb::after{
  content:attr(data-mono);position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 84;
  letter-spacing:-.03em;color:rgba(253,250,248,.86);
}
.card .photo::after{font-size:clamp(30px,7vw,46px)}
.card .photo img,.thumb img{
  position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;
}
.t0{--tint:#A8455E}.t1{--tint:#456B52}.t2{--tint:#B07C2E}.t3{--tint:#4A3D52}

.card .rank{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:11px;
}
.card h2{
  font-family:var(--display);font-weight:700;font-variation-settings:"wdth" 88;
  font-size:clamp(23px,4.2vw,32px);line-height:1.05;letter-spacing:-.02em;margin:0 0 9px;
}
.card .meta{font-size:13.5px;color:var(--ink-soft);margin:0}
.card .foot{
  display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:20px;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);
}
.advances{
  position:absolute;top:12px;right:12px;z-index:2;
  font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;
  padding:5px 10px;border-radius:3px;opacity:0;transform:translateY(4px);
  background:var(--prairie);color:var(--paper);
  box-shadow:0 2px 10px -4px rgba(36,26,32,.6);
  transition:opacity .2s ease,transform .2s ease;
}
.advances.show{opacity:1;transform:translateY(0)}

.versus{
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;font-size:13px;
  letter-spacing:.1em;color:var(--quartz);writing-mode:vertical-rl;padding:0 2px;
}

.odds{margin-top:18px}
.odds-track{
  display:flex;height:8px;border-radius:999px;overflow:hidden;
  background:var(--line);border:1px solid var(--line);
}
.odds-track i{display:block;transition:width .5s cubic-bezier(.4,0,.2,1)}
.odds-track i.left{background:var(--quartz)}
.odds-track i.right{background:var(--ink)}
.odds-legend{
  display:flex;justify-content:space-between;margin-top:7px;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-soft);
}
.odds-note{margin:9px 0 0;font-size:13px;color:var(--ink-soft)}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.keys{margin-top:16px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-soft)}
.keys kbd{
  font-family:var(--mono);background:var(--paper);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:3px;padding:1px 5px;font-size:10px;
}

/* ---------------------------------------------------------- champion */

.crown{
  background:var(--paper);border:1px solid var(--line);border-radius:4px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px;
}
.crown .photo{position:relative;aspect-ratio:21/9;overflow:hidden;background:var(--tint,var(--quartz))}
.crown .photo::after{
  content:attr(data-mono);position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;font-family:var(--display);
  font-weight:800;font-size:64px;color:rgba(253,250,248,.86);letter-spacing:-.03em;
}
.crown .photo img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.crown .body{padding:24px 26px 26px}
.crown .label{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--quartz);margin-bottom:10px;
}
.crown h2{
  font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 86;
  font-size:clamp(30px,6vw,46px);line-height:1;letter-spacing:-.03em;margin:0 0 10px;
}
.crown .sub{color:var(--ink-soft);font-size:14px;margin:0}
.crown .path{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--line)}
.crown .path li{
  display:flex;gap:12px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;
}
.crown .path .rd{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);flex:0 0 92px;
}

/* ---------------------------------------------------------- rankings */

.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px}
.chips button{
  appearance:none;font:inherit;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line);border-radius:999px;background:var(--paper);
  padding:6px 13px;font-size:13px;color:var(--ink-soft);
}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips button .n{font-family:var(--mono);font-size:10.5px;opacity:.65;margin-left:5px}

.board{list-style:none;margin:0;padding:0}
.board li{
  display:grid;grid-template-columns:34px 46px 1fr auto;gap:13px;align-items:center;
  padding:10px 4px;border-bottom:1px solid var(--line);
}
.board .pos{font-family:var(--mono);font-size:13px;color:var(--ink-soft);text-align:right}
.board li:nth-child(-n+3) .pos{color:var(--quartz);font-weight:600;font-size:15px}
.thumb{width:46px;height:46px;border-radius:3px;flex:0 0 auto}
.thumb::after{font-size:15px}
.board .name{
  font-family:var(--display);font-weight:600;font-variation-settings:"wdth" 90;
  font-size:16.5px;letter-spacing:-.01em;
}
.board li:first-child .name{font-size:20px}
.board .sub{font-size:12.5px;color:var(--ink-soft)}
.board .n{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);text-align:right;
}
.close{color:var(--amber);font-weight:600}

.champs{display:flex;gap:8px;overflow-x:auto;margin-bottom:22px;padding-bottom:6px}
.champs .c{
  display:flex;align-items:center;gap:9px;flex:0 0 auto;
  border:1px solid var(--line);border-radius:999px;background:var(--paper);
  padding:5px 14px 5px 5px;font-size:13px;
}
.champs .c .thumb{width:28px;height:28px;border-radius:999px}
.champs .c .thumb::after{font-size:10px}

.splits{list-style:none;margin:0;padding:0}
.splits li{padding:11px 4px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:3px 16px;align-items:baseline}
.splits .matchup{font-family:var(--display);font-weight:600;font-variation-settings:"wdth" 90;font-size:15.5px;flex:1 1 250px}
.splits .matchup em{font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--quartz);margin:0 4px}
.splits .verdicts{font-size:13px;color:var(--ink-soft)}
.splits .verdicts strong{color:var(--ink);font-weight:600}

/* ---------------------------------------------------------- list */

.search{
  width:100%;padding:10px 14px;font:inherit;border:1px solid var(--line);
  border-radius:4px;background:var(--paper);margin-bottom:16px;
}
.search:focus-visible{outline:2px solid var(--quartz);outline-offset:-1px}
.prune{list-style:none;margin:0;padding:0}
.prune li{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.prune .name{flex:1;font-size:15px}
.prune li.off .name{color:var(--ink-soft);text-decoration:line-through}
.prune .tiny{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;border:1px solid var(--line);
  background:transparent;cursor:pointer;color:var(--ink-soft);
}
.prune .tiny:hover{background:var(--paper)}

@media (max-width:680px){
  .duel{grid-template-columns:1fr;gap:10px}
  .versus{writing-mode:horizontal-tb;padding:2px 0}
  .card .body{padding:17px 18px 14px}
  .card .photo{aspect-ratio:2/1}
  .card .foot{padding-top:13px}
  .crown .photo::after{font-size:44px}
  .crown .body{padding:20px}
  .board li{grid-template-columns:26px 40px 1fr auto;gap:10px}
  .thumb{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="wordmark">Table Stakes <span>Sioux Falls</span></div>
  <div class="seg" id="userSeg" role="group" aria-label="Who's voting"></div>
  <div class="seg" role="group" aria-label="View">
    <button data-view="play" aria-pressed="true">Play</button>
    <button data-view="board" aria-pressed="false">Rankings</button>
    <button data-view="prune" aria-pressed="false">List</button>
  </div>
</div>

<main>
  <section class="view" id="view-play">
    <p class="eyebrow" id="playStats">Loading…</p>
    <div id="playBody"></div>
  </section>

  <section class="view" id="view-board" hidden>
    <p class="eyebrow" id="boardStats">Rankings</p>
    <div id="champsBody"></div>
    <div class="chips" id="catChips"></div>
    <div id="boardBody"><p class="loading">Loading…</p></div>
    <div id="splitBody"></div>
  </section>

  <section class="view" id="view-prune" hidden>
    <p class="eyebrow">Turn off anywhere you haven't eaten. It stays out of your brackets.</p>
    <input class="search" id="pruneSearch" type="search" placeholder="Search restaurants" autocomplete="off">
    <div id="pruneBody"><p class="loading">Loading…</p></div>
  </section>
</main>

<script>
// ============================================================ CONFIGURE ME
const API    = 'https://script.google.com/macros/s/AKfycbz5S-KLqc33oKJNmgrhakvBwnW0zpF7rm7t4YzQvN65IbJT7WXDjCH79pLOK-fIyxH8Dw/exec';
const SECRET = 'CHANGE_ME_TO_SOMETHING_RANDOM';
// ==========================================================================

const store = (() => {
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return localStorage; }
  catch (e) { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k,v) => { m[k] = String(v); } }; }
})();

const ROUND_NAMES = ['Quarterfinal', 'Semifinal', 'Final'];

let users = [], user = store.getItem('ts_user') || '', view = 'play';
let br = null, busy = false, listCache = [], category = 'All';

const $ = s => document.querySelector(s);

async function api(action, params = {}, write = false) {
  const payload = Object.assign({ action, secret: SECRET, user }, params);
  let res;
  if (write) {
    // No Content-Type header on purpose: keeps this a "simple request" so the
    // browser skips the CORS preflight that Apps Script can't answer.
    res = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
  } else {
    res = await fetch(API + '?' + new URLSearchParams(payload).toString());
  }
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ---------------------------------------------------------------- chrome

function setView(next) {
  view = next;
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === next)));
  ['play','board','prune'].forEach(v => { $('#view-' + v).hidden = v !== next; });
  if (next === 'board') loadBoard(category);
  if (next === 'prune') loadPrune();
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

function renderUserSeg() {
  $('#userSeg').innerHTML = users.map(u => `<button data-user="${u}" aria-pressed="${u === user}">${u}</button>`).join('');
  $('#userSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    if (br && br.stage === 'playing' && !confirm('Switch to ' + b.dataset.user + '? The current bracket will restart.')) return;
    user = b.dataset.user;
    store.setItem('ts_user', user);
    renderUserSeg();
    newBracket();
    if (view === 'prune') loadPrune();
  }));
}

// ---------------------------------------------------------------- bracket state

/** Lay the eight slots out as four quarterfinals, then build later rounds from winners. */
function buildRounds(field) {
  const qf = [];
  for (let i = 0; i < field.length; i += 2) qf.push({ a: field[i], b: field[i + 1], winner: null });
  return [qf, [], []];
}

async function newBracket() {
  br = null;
  $('#playStats').textContent = 'Drawing a field…';
  $('#playBody').innerHTML = '<p class="loading">Shuffling…</p>';
  try {
    const d = await api('bracket');
    br = {
      stage: 'playing',
      field: d.field,
      alternates: d.alternates || [],
      rounds: buildRounds(d.field),
      r: 0, m: 0,
      path: [],
      stats: d.stats,
    };
    renderPlay();
  } catch (e) { showError(e, '#playBody'); }
  finally { busy = false; }
}

function currentMatch() {
  return br && br.stage === 'playing' ? br.rounds[br.r][br.m] : null;
}

/** Advance the cursor; seed the next round once one fills up. */
function advance() {
  const round = br.rounds[br.r];
  if (br.m < round.length - 1) { br.m++; return; }
  const winners = round.map(x => x.winner);
  if (winners.length === 1) { br.stage = 'done'; return; }
  const next = [];
  for (let i = 0; i < winners.length; i += 2) next.push({ a: winners[i], b: winners[i + 1], winner: null });
  br.rounds[br.r + 1] = next;
  br.r++; br.m = 0;
}

// ---------------------------------------------------------------- bracket rendering

function chip(card, cls) {
  if (!card) return `<span class="chip tbd"><span class="nm">—</span></span>`;
  return `<span class="chip ${cls}"><span class="sd">${card.seed || ''}</span><span class="nm">${escapeHTML(card.name)}</span></span>`;
}

function chipClass(card, match) {
  if (!match || !card) return '';
  const live = br.stage === 'playing' && match === currentMatch();
  if (live) return 'live';
  if (!match.winner) return '';
  return match.winner.id === card.id ? 'won' : 'out';
}

function treeHTML() {
  const cols = [];
  for (let r = 0; r < 3; r++) {
    const matches = br.rounds[r] || [];
    const count = 4 >> r;
    const ties = [];
    for (let i = 0; i < count; i++) {
      const mt = matches[i];
      ties.push(`<div class="tie">${chip(mt && mt.a, chipClass(mt && mt.a, mt))}${chip(mt && mt.b, chipClass(mt && mt.b, mt))}</div>`);
    }
    cols.push(`<div class="col">${ties.join('')}</div>`);
  }
  const champ = br.rounds[2][0] && br.rounds[2][0].winner;
  cols.push(`<div class="col"><div class="tie">${champ ? chip(champ, 'champ') : chip(null)}</div></div>`);
  return `<div class="tree-scroll"><div class="tree">${cols.join('')}</div></div>`;
}

function duelHTML(match) {
  const pctA = Math.round(expected(match.a.elo, match.b.elo) * 100);
  const fav = pctA >= 50 ? match.a : match.b;
  const roundName = ROUND_NAMES[br.r];
  const canSwap = br.r === 0 && br.alternates.length > 0;

  return `
    <div class="duel">
      ${cardHTML('a', match.a)}
      <div class="versus">vs</div>
      ${cardHTML('b', match.b)}
    </div>
    <div class="odds">
      <div class="odds-track">
        <i class="left" style="width:${pctA}%"></i><i class="right" style="width:${100 - pctA}%"></i>
      </div>
      <div class="odds-legend"><span>${pctA}%</span><span>${100 - pctA}%</span></div>
      <p class="odds-note">${pctA === 50
        ? 'No history between these two. Your call sets it.'
        : `The list so far favors <strong>${escapeHTML(fav.name)}</strong> to take this ${roundName.toLowerCase()}.`}</p>
    </div>
    <div class="actions">
      ${canSwap ? `<button class="btn" data-swap="a">Never been to ${escapeHTML(short(match.a.name))}</button>
                   <button class="btn" data-swap="b">Never been to ${escapeHTML(short(match.b.name))}</button>` : ''}
      <button class="btn quiet" data-act="restart">New field</button>
    </div>
    <p class="keys"><kbd>←</kbd> left advances &nbsp; <kbd>→</kbd> right advances</p>`;
}

function cardHTML(side, c) {
  const img = c.photo
    ? `<img src="${escapeHTML(c.photo)}" alt="" loading="eager" referrerpolicy="no-referrer" onerror="this.remove()">`
    : '';
  return `
  <button class="card" data-side="${side}">
    <div class="photo t${tintFor(c.name)}" data-mono="${escapeHTML(monogram(c.name))}">${img}</div>
    <div class="body">
      <div class="rank">Seed ${c.seed}${c.categories && c.categories.length ? ' · ' + escapeHTML(c.categories.join(', ')) : ''}</div>
      <h2>${escapeHTML(c.name)}</h2>
      <p class="meta">${escapeHTML([c.cuisine, c.address].filter(Boolean).join(' · ')) || '&nbsp;'}</p>
      <div class="foot"><span>${c.matches ? c.matches + ' prior matchup' + (c.matches === 1 ? '' : 's') : 'never judged'}</span></div>
    </div>
    <div class="advances" data-adv="${side}">advances</div>
  </button>`;
}

function renderPlay() {
  if (!br) return;
  if (br.stage === 'done') return renderChampion();

  const match = currentMatch();
  const total = br.rounds[br.r].length;
  $('#playStats').innerHTML =
    `${ROUND_NAMES[br.r]} · match <b>${br.m + 1}</b> of ${total} · field of ${br.field.length}`;
  $('#playBody').innerHTML = treeHTML() + duelHTML(match);

  $('#playBody').querySelectorAll('.card').forEach(el => el.addEventListener('click', () => pick(el.dataset.side)));
  $('#playBody').querySelectorAll('[data-swap]').forEach(el => el.addEventListener('click', () => swapOut(el.dataset.swap)));
  $('#playBody').querySelectorAll('[data-act="restart"]').forEach(el => el.addEventListener('click', () => { busy = true; newBracket(); }));
  scrollTree();
}

/** Keep the round being played in view on narrow screens. */
function scrollTree() {
  const box = $('.tree-scroll');
  if (!box) return;
  const col = box.querySelectorAll('.col')[br.r];
  if (col) box.scrollLeft = Math.max(0, col.offsetLeft - 16);
}

// ---------------------------------------------------------------- playing

async function pick(side) {
  if (busy || !br || br.stage !== 'playing') return;
  const match = currentMatch();
  busy = true;

  const cards = { a: $('[data-side="a"]'), b: $('[data-side="b"]') };
  try {
    const d = await api('vote', { a: match.a.id, b: match.b.id, result: side }, true);

    // Ratings stay hidden, but the local copy has to track the server so the
    // odds bar for later rounds reflects what just happened.
    match.a.elo = d.a.after;
    match.b.elo = d.b.after;

    match.winner = side === 'a' ? match.a : match.b;
    const loser = side === 'a' ? match.b : match.a;
    br.path.push({ round: ROUND_NAMES[br.r], winner: match.winner, loser: loser });

    cards[side].classList.add('win');
    cards[side === 'a' ? 'b' : 'a'].classList.add('lose');
    const chipEl = cards[side].querySelector('[data-adv]');
    if (chipEl) chipEl.classList.add('show');

    setTimeout(() => { advance(); busy = false; renderPlay(); }, 560);
  } catch (e) {
    showError(e, '#playBody');
    busy = false;
  }
}

async function swapOut(side) {
  if (busy || !br || br.r !== 0 || !br.alternates.length) return;
  busy = true;
  const match = currentMatch();
  const dropped = match[side];
  const replacement = br.alternates.shift();
  replacement.seed = dropped.seed;
  try {
    await api('mark', { id: dropped.id, status: 'excluded' }, true);
    match[side] = replacement;
    const idx = br.field.findIndex(f => f.id === dropped.id);
    if (idx >= 0) br.field[idx] = replacement;
    renderPlay();
  } catch (e) { showError(e, '#playBody'); }
  finally { busy = false; }
}

document.addEventListener('keydown', e => {
  if (view !== 'play' || busy || !br || br.stage !== 'playing') return;
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'ArrowLeft') pick('a');
  if (e.key === 'ArrowRight') pick('b');
});

// ---------------------------------------------------------------- champion

async function renderChampion() {
  const champ = br.rounds[2][0].winner;
  const runnerUp = br.path[br.path.length - 1].loser;
  const beat = br.path.filter(p => p.winner.id === champ.id);

  $('#playStats').innerHTML = `Bracket complete · <b>${br.path.length}</b> calls, all counted`;
  const img = champ.photo
    ? `<img src="${escapeHTML(champ.photo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`
    : '';

  $('#playBody').innerHTML = `
    <div class="crown t${tintFor(champ.name)}">
      <div class="photo t${tintFor(champ.name)}" data-mono="${escapeHTML(monogram(champ.name))}">${img}</div>
      <div class="body">
        <div class="label">Champion · seed ${champ.seed}</div>
        <h2>${escapeHTML(champ.name)}</h2>
        <p class="sub">${escapeHTML([champ.cuisine, champ.address].filter(Boolean).join(' · '))}</p>
        <ul class="path">
          ${beat.map(p => `<li><span class="rd">${p.round}</span><span>beat ${escapeHTML(p.loser.name)}</span></li>`).join('')}
        </ul>
        <p class="sub" id="titleLine" style="margin-top:16px"></p>
      </div>
    </div>
    ${treeHTML()}
    <div class="actions">
      <button class="btn strong" data-act="share">Share result</button>
      <button class="btn" data-act="again">Run another field</button>
      <button class="btn quiet" data-act="rankings">See the rankings</button>
    </div>`;

  $('#playBody').querySelector('[data-act="share"]').addEventListener('click', () => share(champ, beat));
  $('#playBody').querySelector('[data-act="again"]').addEventListener('click', () => { busy = true; newBracket(); });
  $('#playBody').querySelector('[data-act="rankings"]').addEventListener('click', () => setView('board'));

  try {
    const d = await api('crown', {
      champion: champ.id,
      runnerUp: runnerUp.id,
      field: br.field.map(f => f.id).join(','),
    }, true);
    const el = $('#titleLine');
    if (el) el.textContent = d.titles > 1 ? `${ordinal(d.titles)} title for ${d.champion}.` : `First title for ${d.champion}.`;
  } catch (e) { /* the votes already landed; the trophy log is cosmetic */ }
}

function shareText(champ, beat) {
  const d = new Date();
  return [
    `Table Stakes 🍽 ${d.getMonth() + 1}/${d.getDate()}`,
    `🏆 ${champ.name}`,
    '',
    ...beat.map(p => `def. ${p.loser.name}`),
    '',
    `Field of ${br.field.length} · judged by ${user}`,
  ].join('\n');
}

async function share(champ, beat) {
  const text = shareText(champ, beat);
  const btn = $('[data-act="share"]');
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text);
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = 'Share result'; }, 1800);
  } catch (e) {
    // Clipboard denied or share dismissed — fall back to something selectable.
    if (e && e.name === 'AbortError') return;
    btn.insertAdjacentHTML('afterend',
      `<textarea class="search" readonly rows="7" style="margin-top:12px">${escapeHTML(text)}</textarea>`);
    btn.disabled = true;
  }
}

// ---------------------------------------------------------------- rankings

async function loadBoard(cat) {
  category = cat || 'All';
  $('#boardBody').innerHTML = '<p class="loading">Loading…</p>';
  $('#splitBody').innerHTML = '';
  try {
    const d = await api('board', { category: category });

    $('#catChips').innerHTML =
      `<button data-cat="All" aria-pressed="${category === 'All'}">Everywhere</button>` +
      d.categories.map(c =>
        `<button data-cat="${escapeHTML(c.name)}" aria-pressed="${category === c.name}">${escapeHTML(c.name)}<span class="n">${c.count}</span></button>`).join('');
    $('#catChips').querySelectorAll('button').forEach(b => b.addEventListener('click', () => loadBoard(b.dataset.cat)));

    $('#champsBody').innerHTML = d.champions.length
      ? '<div class="champs">' + d.champions.map(c => `
          <span class="c">
            <span class="thumb t${tintFor(c.name)}" data-mono="${escapeHTML(monogram(c.name))}">${
              c.photo ? `<img src="${escapeHTML(c.photo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''
            }</span>
            <span>${escapeHTML(c.name)}</span>
          </span>`).join('') + '</div>'
      : '';

    if (!d.items.length) {
      $('#boardStats').innerHTML = category === 'All' ? 'Rankings' : `Rankings · ${escapeHTML(category)}`;
      $('#boardBody').innerHTML = `<p class="note"><strong>Nothing has qualified yet.</strong><br>
        A place enters the rankings after ${d.minMatches} matchup${d.minMatches === 1 ? '' : 's'}. ${d.provisional} haven't played one yet — run a bracket.</p>`;
      return;
    }

    const scope = category === 'All' ? 'in town' : `in ${category}`;
    $('#boardStats').innerHTML =
      `Top <b>${d.items.length}</b> of ${d.ranked} ranked ${scope}` +
      (d.provisional ? ` · ${d.provisional} not yet played` : '');

    $('#boardBody').innerHTML = '<ol class="board">' + d.items.map(r => `
      <li>
        <span class="pos">${r.rank}</span>
        <span class="thumb t${tintFor(r.name)}" data-mono="${escapeHTML(monogram(r.name))}">${
          r.photo ? `<img src="${escapeHTML(r.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''
        }</span>
        <span>
          <span class="name">${escapeHTML(r.name)}</span><br>
          <span class="sub">${escapeHTML(subFor(r))}${
            r.photoFinish ? ' · <span class="close">too close to call</span>' : ''}</span>
        </span>
        <span class="n">${r.matches}&nbsp;calls</span>
      </li>`).join('') + '</ol>';

    if (d.splits && d.splits.length) {
      $('#splitBody').innerHTML = `
        <p class="eyebrow" style="margin:36px 0 12px">Split decisions · <b>${d.splits.length}</b></p>
        <ul class="splits">` + d.splits.map(s => `
          <li>
            <span class="matchup">${escapeHTML(s.a)} <em>vs</em> ${escapeHTML(s.b)}</span>
            <span class="verdicts">${s.picks.map(p => `${escapeHTML(p.user)} said <strong>${escapeHTML(p.pick)}</strong>`).join(' · ')}</span>
          </li>`).join('') + '</ul>';
    }
  } catch (e) { showError(e, '#boardBody'); }
}

// ---------------------------------------------------------------- list

async function loadPrune() {
  $('#pruneBody').innerHTML = '<p class="loading">Loading…</p>';
  try {
    const d = await api('list');
    listCache = d.items;
    drawPrune();
  } catch (e) { showError(e, '#pruneBody'); }
}

function drawPrune() {
  const q = $('#pruneSearch').value.trim().toLowerCase();
  const items = listCache.filter(r => !q || r.name.toLowerCase().includes(q));
  $('#pruneBody').innerHTML = '<ul class="prune">' + items.map(r => `
    <li class="${r.status === 'excluded' ? 'off' : ''}">
      <span class="name">${escapeHTML(r.name)}</span>
      <button class="tiny" data-toggle="${r.id}">${r.status === 'excluded' ? 'Add back' : 'Never been'}</button>
    </li>`).join('') + '</ul>';

  $('#pruneBody').querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', async () => {
    const item = listCache.find(x => x.id === b.dataset.toggle);
    const next = item.status === 'excluded' ? 'active' : 'excluded';
    b.disabled = true;
    try { await api('mark', { id: item.id, status: next }, true); item.status = next; drawPrune(); }
    catch (e) { showError(e, '#pruneBody'); }
  }));
}
$('#pruneSearch').addEventListener('input', () => { if (listCache.length) drawPrune(); });

// ---------------------------------------------------------------- misc

function expected(ra, rb) { return 1 / (1 + Math.pow(10, (rb - ra) / 400)); }

/**
 * Row subtitle. Filtering on a category makes repeating it on every row
 * noise, so it's dropped — the other categories and the address stay.
 */
function subFor(r) {
  const cats = (r.categories || []).filter(t => t.toLowerCase() !== category.toLowerCase());
  return category === 'All'
    ? cats.join(' · ')
    : [cats.join(' · '), r.address].filter(Boolean).join(' · ');
}
function short(name) { return name.length > 20 ? name.slice(0, 19) + '…' : name; }
function ordinal(n) {
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function monogram(name) {
  const words = String(name || '?').replace(/[^\p{L}\p{N} ]/gu, ' ').split(/\s+/)
    .filter(w => w && !/^(the|a|of|and|on|at|by)$/i.test(w));
  if (!words.length) return '?';
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
function tintFor(name) {
  let h = 0;
  for (const ch of String(name || '')) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return h % 4;
}
function escapeHTML(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function showError(err, target = '#playBody') {
  $(target).innerHTML = `<p class="note"><strong>That didn't go through.</strong><br>${escapeHTML(err.message)}</p>`;
}

// ---------------------------------------------------------------- boot

(async function boot() {
  if (API.startsWith('PASTE_')) {
    $('#playStats').textContent = 'Setup';
    $('#playBody').innerHTML = `<p class="note"><strong>Point this page at your backend.</strong><br>
      Replace <code>API</code> with your Apps Script <code>/exec</code> URL and <code>SECRET</code> with the one from <code>Code.gs</code>.</p>`;
    return;
  }
  try {
    const cfg = await api('config');
    users = cfg.users;
    if (!users.includes(user)) user = users[0];
    store.setItem('ts_user', user);
    renderUserSeg();
    newBracket();
  } catch (e) { showError(e); }
})();
</script>
